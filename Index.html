<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Timing Pro - ISP Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --edit: #f59e0b; --success: #16a34a; 
            --danger: #dc2626; --warning: #eab308; --bg: #f1f5f9; 
            --dark: #0f172a; --card-bg: #ffffff;
        }
        
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); line-height: 1.6; }
        .container { max-width: 1400px; margin: auto; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .logo-area h1 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; color: var(--primary); }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .stat-card::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: var(--primary); }
        .stat-card.expired::after { background: var(--danger); }
        .stat-card.active-st::after { background: var(--success); }
        .stat-card h3 { margin: 0; font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card p { margin: 10px 0 0; font-size: 26px; font-weight: 800; }

        /* Form */
        .form-box { background: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; font-size: 0.85rem; }
        input, select { width: 100%; box-sizing: border-box; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; background: #f8fafc; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        /* Table */
        .table-container { background: white; border-radius: 15px; overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #f8fafc; padding: 18px; text-align: left; font-weight: 600; border-bottom: 2px solid #edf2f7; }
        td { padding: 15px 18px; border-bottom: 1px solid #f1f5f9; }

        /* Status Badges */
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .active { background: #dcfce7; color: #166534; }
        .warning { background: #fef9c3; color: #854d0e; }
        .expired { background: #fee2e2; color: #991b1b; }

        /* Buttons */
        .btn { border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .icon-btn { padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; background: white; cursor: pointer; }
        .icon-btn:hover { background: #f1f5f9; transform: scale(1.05); }

        .tool-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
        .search-input { padding: 12px 15px; border-radius: 10px; border: 1px solid #e2e8f0; width: 300px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <h1>🌐 Smart Timing Pro</h1>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="background:#64748b; color:white" onclick="document.getElementById('importFile').click()">📤 Import</button>
            <button class="btn" style="background:var(--success); color:white" onclick="exportToExcel()">📥 Export Excel</button>
            <input type="file" id="importFile" style="display:none" onchange="importFromExcel(event)">
        </div>
    </div>

    <div class="stats">
        <div class="stat-card"><h3>Total Customers</h3><p id="count">0</p></div>
        <div class="stat-card active-st"><h3>Total Revenue</h3><p id="income">$0.00</p></div>
        <div class="stat-card active-st"><h3>Active Subs</h3><p id="activeCount" style="color:var(--success)">0</p></div>
        <div class="stat-card expired"><h3>Expired Subs</h3><p id="expiredCount" style="color:var(--danger)">0</p></div>
    </div>

    <div class="form-box">
        <h3 id="formTitle" style="margin-top:0; color:var(--primary)">👤 Add / Edit Subscriber</h3>
        <div class="grid-inputs">
            <div class="input-group"><label>Customer Name</label><input type="text" id="name" placeholder="John Doe" data-index="0"></div>
            <div class="input-group"><label>Phone (WhatsApp)</label><input type="text" id="phone" placeholder="10xxxxxxxx" data-index="1"></div>
            <div class="input-group">
                <label>Package Plan</label>
                <select id="packageSelect" data-index="2" onchange="toggleManualPackage(); calculateExpiry();">
                    <option value="Super 140GB">Super 140GB</option>
                    <option value="Mega 250GB">Mega 250GB</option>
                    <option value="Ultra 600GB">Ultra 600GB</option>
                    <option value="manual">➕ Custom Package...</option>
                </select>
            </div>
            <div id="manualDiv" style="display:none;" class="input-group"><label>Custom Plan Name</label><input type="text" id="manualPackage" data-index="3"></div>
            <div class="input-group"><label>Price Paid</label><input type="number" id="price" placeholder="0.00" data-index="4"></div>
            <div class="input-group"><label>Activation Date</label><input type="date" id="startDate" data-index="5" onchange="calculateExpiry()"></div>
            <div class="input-group"><label>Expiry Date</label><input type="date" id="expDate" data-index="6"></div>
        </div>
        
        <div style="margin-top: 15px;">
            <label style="font-size: 12px; font-weight: 600;">Internal Notes</label>
            <input type="text" id="note" placeholder="Extra details..." data-index="7">
        </div>

        <input type="hidden" id="editId">
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="mainBtn" class="btn btn-primary" style="flex: 1; justify-content: center;" onclick="handleSave()">💾 Save Subscriber</button>
            <button id="cancelBtn" class="btn" style="display:none; background:#e2e8f0;" onclick="cancelEditMode()">Cancel</button>
        </div>
    </div>

    <div class="tool-bar">
        <input type="text" id="searchBox" class="search-input" placeholder="🔍 Search name or phone..." oninput="render()">
        <div style="display:flex; gap: 8px;">
            <button class="filter-btn btn active" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn btn" onclick="setFilter('active', this)">Active</button>
            <button class="filter-btn btn" onclick="setFilter('expired', this)">Expired</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Package</th>
                    <th>Timeline</th>
                    <th>Remaining</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('isp_pro_data')) || [];
    let isEditMode = false;
    let currentFilter = 'all';

    window.onload = () => {
        document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
        updateAll();
    };

    function calculateExpiry() {
        const start = document.getElementById('startDate').value;
        if (start) {
            let d = new Date(start);
            d.setMonth(d.getMonth() + 1);
            document.getElementById('expDate').value = d.toISOString().split('T')[0];
        }
    }

    function toggleManualPackage() {
        const s = document.getElementById('packageSelect');
        document.getElementById('manualDiv').style.display = (s.value === 'manual') ? 'block' : 'none';
    }

    function handleSave() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const price = parseFloat(document.getElementById('price').value) || 0;
        const sVal = document.getElementById('packageSelect').value;
        const pkg = (sVal === 'manual') ? document.getElementById('manualPackage').value : sVal;
        const startDate = document.getElementById('startDate').value;
        const expDate = document.getElementById('expDate').value;
        const note = document.getElementById('note').value;

        if(!name || !expDate) return alert("Please enter Name and Expiry Date!");

        const data = { id: id ? parseInt(id) : Date.now(), name, phone, price, package: pkg, startDate, expDate, note };

        if (isEditMode) {
            const idx = db.findIndex(c => c.id === data.id);
            db[idx] = data;
            cancelEditMode();
        } else {
            db.push(data);
        }

        updateAll();
        clearInputs();
    }

    function render() {
        const body = document.getElementById('tableBody');
        const search = document.getElementById('searchBox').value.toLowerCase();
        const today = new Date();
        today.setHours(0,0,0,0);
        
        body.innerHTML = '';
        
        db.filter(c => {
            const matchesSearch = c.name.toLowerCase().includes(search) || c.phone.includes(search);
            const isExp = new Date(c.expDate) < today;
            if (currentFilter === 'active') return matchesSearch && !isExp;
            if (currentFilter === 'expired') return matchesSearch && isExp;
            return matchesSearch;
        }).sort((a,b) => new Date(a.expDate) - new Date(b.expDate)).forEach(c => {
            const expDate = new Date(c.expDate);
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            
            let statusCls = 'active', statusTxt = 'Active';
            if (diffDays < 0) { statusCls = 'expired'; statusTxt = 'Expired'; }
            else if (diffDays <= 3) { statusCls = 'warning'; statusTxt = 'Expiring Soon'; }

            body.innerHTML += `
                <tr>
                    <td><strong>${c.name}</strong><br><small>${c.phone}</small></td>
                    <td>${c.package}<br><small style="color:green">$${c.price}</small></td>
                    <td><small>Starts: ${c.startDate}<br>Ends: ${c.expDate}</small></td>
                    <td><span style="font-weight:bold; color:${diffDays < 0 ? 'red' : 'inherit'}">
                        ${diffDays >= 0 ? diffDays + ' Days' : Math.abs(diffDays) + ' Days Overdue'}
                    </span></td>
                    <td><span class="status-badge ${statusCls}">${statusTxt}</span></td>
                    <td>
                        <button class="icon-btn" onclick="editCst(${c.id})">✏️</button>
                        <button class="icon-btn" onclick="renewCst(${c.id})" title="Renew 1 Month">🔄</button>
                        <button class="icon-btn" onclick="sendWA('${c.phone}','${c.name}','${c.expDate}')">📱</button>
                        <button class="icon-btn" onclick="deleteCst(${c.id})" style="color:red">🗑️</button>
                    </td>
                </tr>`;
        });
    }

    function renewCst(id) {
        if(!confirm('Renew subscription for 1 month from today?')) return;
        const idx = db.findIndex(c => c.id === id);
        const today = new Date();
        const nextMonth = new Date();
        nextMonth.setMonth(today.getMonth() + 1);
        db[idx].startDate = today.toISOString().split('T')[0];
        db[idx].expDate = nextMonth.toISOString().split('T')[0];
        updateAll();
    }

    function sendWA(phone, name, date) {
        const msg = `Hello ${name}, this is a reminder that your internet subscription expires on ${date}. Please renew to avoid service interruption. Thank you!`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function deleteCst(id) {
        if(confirm('Are you sure you want to delete this customer?')) {
            db = db.filter(i => i.id !== id);
            updateAll();
        }
    }

    function editCst(id) {
        const c = db.find(i => i.id === id);
        isEditMode = true;
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('phone').value = c.phone;
        document.getElementById('price').value = c.price;
        document.getElementById('packageSelect').value = ['Super 140GB', 'Mega 250GB', 'Ultra 600GB'].includes(c.package) ? c.package : 'manual';
        if(document.getElementById('packageSelect').value === 'manual') {
            document.getElementById('manualDiv').style.display = 'block';
            document.getElementById('manualPackage').value = c.package;
        }
        document.getElementById('startDate').value = c.startDate;
        document.getElementById('expDate').value = c.expDate;
        document.getElementById('note').value = c.note;
        document.getElementById('mainBtn').innerText = "🔄 Update Subscriber";
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo(0,0);
    }

    function updateAll() {
        localStorage.setItem('isp_pro_data', JSON.stringify(db));
        render();
        stats();
    }

    function stats() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('count').innerText = db.length;
        document.getElementById('income').innerText = '$' + db.reduce((s, c) => s + (c.price || 0), 0);
        document.getElementById('activeCount').innerText = db.filter(c => c.expDate >= today).length;
        document.getElementById('expiredCount').innerText = db.filter(c => c.expDate < today).length;
    }

    function clearInputs() {
        ['name','phone','price','manualPackage','note','expDate'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
    }

    function cancelEditMode() {
        isEditMode = false;
        document.getElementById('editId').value = '';
        document.getElementById('mainBtn').innerText = "💾 Save Subscriber";
        document.getElementById('cancelBtn').style.display = 'none';
        clearInputs();
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(db);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Subscribers");
        XLSX.writeFile(wb, `ISP_Data_${new Date().toLocaleDateString()}.xlsx`);
    }

    function importFromExcel(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            db = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            updateAll();
        };
        reader.readAsArrayBuffer(file);
    }

    function setFilter(f, btn) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
        btn.classList.add('active', 'btn-primary');
        render();
    }
</script>
</body>
</html>
